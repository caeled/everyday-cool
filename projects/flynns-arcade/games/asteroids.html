<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="data:," />
    <title>Asteroids</title>
    <style>
      :root {
        --ink: #e8f1f2;
        --dim: #8fa8ad;
        --accent: #ffd23f;
        --cyan: #6ee7e0;
        --danger: #ff5d5d;
        --panel: rgba(10, 16, 20, 0.72);
        --line: rgba(232, 241, 242, 0.22);
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        background: #04070a;
        color: var(--ink);
        font-family: "Courier New", ui-monospace, SFMono-Regular, Menlo, monospace;
        overflow: hidden;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      #wrap {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
      }
      /* ---------- HUD ---------- */
      #hud {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 12px;
        padding: 10px 14px 6px;
        pointer-events: none;
        z-index: 3;
      }
      .hud-block { min-width: 0; }
      .hud-label {
        font-size: 11px;
        letter-spacing: 0.18em;
        color: var(--dim);
        text-transform: uppercase;
      }
      #score {
        font-size: clamp(22px, 4.5vw, 34px);
        font-weight: bold;
        line-height: 1.05;
        font-variant-numeric: tabular-nums;
      }
      #highscore {
        font-size: 12px;
        color: var(--dim);
        font-variant-numeric: tabular-nums;
      }
      #lives { display: flex; gap: 5px; padding-top: 6px; min-height: 22px; }
      #lives svg { width: 20px; height: 20px; }
      #wave-box { text-align: right; }
      #wave {
        font-size: clamp(18px, 3.5vw, 26px);
        font-weight: bold;
        line-height: 1.05;
        font-variant-numeric: tabular-nums;
      }
      #hud-buttons { pointer-events: auto; display: flex; gap: 8px; }
      .hud-btn {
        min-width: 44px;
        min-height: 44px;
        padding: 8px 10px;
        background: var(--panel);
        color: var(--ink);
        border: 1px solid var(--line);
        border-radius: 6px;
        font: inherit;
        font-size: 15px;
        cursor: pointer;
      }
      .hud-btn:active { background: rgba(110, 231, 224, 0.18); }
      /* ---------- Stage ---------- */
      #stage { position: relative; flex: 1; min-height: 0; }
      canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
      }
      /* ---------- Overlay ---------- */
      #overlay {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 20px;
        z-index: 2;
      }
      #overlay.hidden { display: none; }
      .card { max-width: 520px; }
      .card h1 {
        margin: 0 0 6px;
        font-size: clamp(38px, 9vw, 64px);
        letter-spacing: 0.14em;
        font-weight: bold;
        text-shadow: 0 0 18px rgba(110, 231, 224, 0.55), 0 0 46px rgba(110, 231, 224, 0.25);
      }
      .card h2 {
        margin: 0 0 10px;
        font-size: clamp(28px, 7vw, 44px);
        letter-spacing: 0.12em;
        color: var(--danger);
        text-shadow: 0 0 16px rgba(255, 93, 93, 0.5);
      }
      .card p { margin: 8px 0; color: var(--ink); font-size: clamp(14px, 2.6vw, 16px); line-height: 1.55; }
      .card .sub { color: var(--dim); }
      .card .final-score { font-size: clamp(20px, 5vw, 30px); color: var(--accent); font-weight: bold; }
      .card .new-best { color: var(--accent); letter-spacing: 0.14em; font-size: 13px; text-transform: uppercase; }
      .big-btn {
        margin-top: 18px;
        min-height: 52px;
        padding: 12px 30px;
        font: inherit;
        font-size: 18px;
        font-weight: bold;
        letter-spacing: 0.12em;
        color: #04070a;
        background: var(--accent);
        border: none;
        border-radius: 6px;
        cursor: pointer;
      }
      .big-btn:active { transform: translateY(1px); }
      .controls-list {
        margin: 18px auto 0;
        display: grid;
        grid-template-columns: auto auto;
        gap: 4px 16px;
        text-align: left;
        width: fit-content;
        font-size: 13px;
        color: var(--dim);
      }
      .controls-list b { color: var(--ink); font-weight: normal; text-align: right; }
      .points-table {
        margin: 14px auto 0;
        width: fit-content;
        font-size: 13px;
        color: var(--dim);
        text-align: left;
        line-height: 1.7;
      }
      .points-table span { color: var(--ink); }
      /* ---------- Touch controls ---------- */
      #touch {
        display: none;
        justify-content: space-between;
        align-items: flex-end;
        gap: 10px;
        padding: 10px 12px calc(12px + env(safe-area-inset-bottom));
        z-index: 3;
      }
      body.touch #touch { display: flex; }
      .touch-cluster { display: flex; gap: 10px; }
      .tbtn {
        width: 64px;
        height: 64px;
        border-radius: 50%;
        border: 1px solid var(--line);
        background: var(--panel);
        color: var(--ink);
        font-size: 24px;
        font-family: inherit;
        display: flex;
        align-items: center;
        justify-content: center;
        touch-action: none;
        cursor: pointer;
      }
      .tbtn.held { background: rgba(110, 231, 224, 0.28); border-color: var(--cyan); }
      .tbtn.fire { width: 76px; height: 76px; font-size: 13px; letter-spacing: 0.08em; border-color: rgba(255, 210, 63, 0.5); color: var(--accent); }
      .tbtn.fire.held { background: rgba(255, 210, 63, 0.28); }
      @media (max-width: 520px) {
        .controls-list { display: none; }
        .tbtn { width: 58px; height: 58px; }
        .tbtn.fire { width: 70px; height: 70px; }
      }
    </style>
  </head>
  <body>
    <div id="wrap">
      <div id="hud">
        <div class="hud-block">
          <div class="hud-label">Score</div>
          <div id="score">0</div>
          <div id="highscore">BEST 0</div>
          <div id="lives" aria-label="Lives remaining"></div>
        </div>
        <div id="hud-buttons">
          <button class="hud-btn" id="sound-btn" type="button" aria-label="Toggle sound">♪ On</button>
          <button class="hud-btn" id="pause-btn" type="button" aria-label="Pause game">❚❚</button>
        </div>
        <div class="hud-block" id="wave-box">
          <div class="hud-label">Wave</div>
          <div id="wave">1</div>
        </div>
      </div>

      <div id="stage">
        <canvas id="game"></canvas>
        <div id="overlay">
          <div class="card" id="overlay-card"></div>
        </div>
      </div>

      <div id="touch" aria-hidden="false">
        <div class="touch-cluster">
          <button class="tbtn" id="btn-left" type="button" aria-label="Rotate left">◀</button>
          <button class="tbtn" id="btn-right" type="button" aria-label="Rotate right">▶</button>
        </div>
        <div class="touch-cluster">
          <button class="tbtn" id="btn-thrust" type="button" aria-label="Thrust">▲</button>
          <button class="tbtn fire" id="btn-fire" type="button" aria-label="Fire">FIRE</button>
        </div>
      </div>
    </div>

    <script>
      "use strict";
      // ============================================================
      // ASTEROIDS — classic vector arcade, rebuilt for the browser.
      // ============================================================
      var canvas = document.getElementById("game");
      var ctx = canvas.getContext("2d");
      var stage = document.getElementById("stage");
      var overlay = document.getElementById("overlay");
      var overlayCard = document.getElementById("overlay-card");
      var scoreEl = document.getElementById("score");
      var highEl = document.getElementById("highscore");
      var livesEl = document.getElementById("lives");
      var waveEl = document.getElementById("wave");

      var W = 0, H = 0, DPR = 1;

      function resize() {
        DPR = Math.min(window.devicePixelRatio || 1, 2);
        W = stage.clientWidth;
        H = stage.clientHeight;
        canvas.width = Math.round(W * DPR);
        canvas.height = Math.round(H * DPR);
        ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
        buildStars();
      }

      // ---------- Stars ----------
      var stars = [];
      function buildStars() {
        stars = [];
        var n = Math.floor((W * H) / 9000);
        for (var i = 0; i < n; i++) {
          stars.push({
            x: Math.random() * W,
            y: Math.random() * H,
            r: Math.random() * 1.3 + 0.3,
            p: Math.random() * Math.PI * 2
          });
        }
      }

      // ---------- Sound (WebAudio, synthesized) ----------
      var audioCtx = null;
      var soundOn = true;
      function ensureAudio() {
        if (!audioCtx) {
          try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { audioCtx = null; }
        }
        if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
      }
      function beep(freq, dur, type, vol, slideTo) {
        if (!soundOn || !audioCtx) return;
        var t = audioCtx.currentTime;
        var osc = audioCtx.createOscillator();
        var gain = audioCtx.createGain();
        osc.type = type || "square";
        osc.frequency.setValueAtTime(freq, t);
        if (slideTo) osc.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), t + dur);
        gain.gain.setValueAtTime(vol || 0.08, t);
        gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(t); osc.stop(t + dur + 0.02);
      }
      function noiseBurst(dur, vol) {
        if (!soundOn || !audioCtx) return;
        var t = audioCtx.currentTime;
        var len = Math.floor(audioCtx.sampleRate * dur);
        var buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
        var data = buf.getChannelData(0);
        for (var i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / len);
        var src = audioCtx.createBufferSource();
        src.buffer = buf;
        var gain = audioCtx.createGain();
        gain.gain.setValueAtTime(vol, t);
        gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        var filter = audioCtx.createBiquadFilter();
        filter.type = "lowpass"; filter.frequency.value = 900;
        src.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
        src.start(t);
      }
      var sfx = {
        shoot: function () { beep(880, 0.12, "square", 0.05, 220); },
        rock: function (big) { noiseBurst(big ? 0.35 : 0.2, big ? 0.22 : 0.14); },
        ship: function () { noiseBurst(0.7, 0.3); beep(160, 0.6, "sawtooth", 0.1, 40); },
        saucer: function () { beep(1200, 0.15, "sine", 0.06, 500); },
        extraLife: function () {
          beep(660, 0.1, "square", 0.07); setTimeout(function () { beep(880, 0.1, "square", 0.07); }, 90);
          setTimeout(function () { beep(1320, 0.18, "square", 0.07); }, 190);
        },
        wave: function () { beep(440, 0.12, "triangle", 0.09, 880); }
      };

      // ---------- Game state ----------
      var STATE = { MENU: 0, PLAYING: 1, PAUSED: 2, OVER: 3 };
      var state = STATE.MENU;
      var score = 0, best = 0, lives = 3, wave = 1;
      var nextExtraLife = 10000;
      var ship = null;
      var bullets = [];       // player bullets
      var saucerBullets = []; // enemy bullets
      var rocks = [];
      var particles = [];
      var saucer = null;
      var saucerTimer = 0;
      var waveBreakTimer = 0;
      var shake = 0;
      var time = 0;

      var keys = { left: false, right: false, thrust: false, fire: false };

      function rand(a, b) { return a + Math.random() * (b - a); }

      function wrap(e) {
        if (e.x < -30) e.x += W + 60; else if (e.x > W + 30) e.x -= W + 60;
        if (e.y < -30) e.y += H + 60; else if (e.y > H + 30) e.y -= H + 60;
      }
      function dist2(a, b) {
        var dx = a.x - b.x, dy = a.y - b.y;
        // account for wrap-around distance
        if (dx > W / 2) dx -= W; else if (dx < -W / 2) dx += W;
        if (dy > H / 2) dy -= H; else if (dy < -H / 2) dy += H;
        return dx * dx + dy * dy;
      }

      // ---------- Ship ----------
      function makeShip() {
        return {
          x: W / 2, y: H / 2, vx: 0, vy: 0,
          angle: -Math.PI / 2, r: 11,
          invuln: 2.5, dead: false, thrusting: false, fireCooldown: 0
        };
      }

      // ---------- Asteroids ----------
      function makeRock(x, y, size) {
        // size: 3 = large, 2 = medium, 1 = small
        var radius = size === 3 ? rand(38, 48) : size === 2 ? rand(20, 27) : rand(10, 14);
        var verts = [];
        var n = 9 + Math.floor(Math.random() * 4);
        for (var i = 0; i < n; i++) {
          verts.push({ a: (i / n) * Math.PI * 2, d: radius * rand(0.72, 1.12) });
        }
        var speedBase = (4 - size) * 14 + wave * 3;
        var ang = rand(0, Math.PI * 2);
        var sp = rand(speedBase * 0.5, speedBase) + rand(8, 26);
        return {
          x: x, y: y, size: size, r: radius, verts: verts,
          vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp,
          rot: rand(0, Math.PI * 2), vrot: rand(-0.9, 0.9)
        };
      }
      function spawnWave() {
        rocks = [];
        var count = 3 + wave; // wave 1 = 4 rocks, grows from there
        for (var i = 0; i < count; i++) {
          var x, y, tries = 0;
          do {
            x = rand(0, W); y = rand(0, H); tries++;
          } while (ship && dist2({ x: x, y: y }, ship) < 170 * 170 && tries < 30);
          rocks.push(makeRock(x, y, 3));
        }
        saucerTimer = rand(18, 30);
      }

      // ---------- Particles ----------
      function explode(x, y, count, color, speed) {
        for (var i = 0; i < count; i++) {
          var a = rand(0, Math.PI * 2), s = rand(speed * 0.2, speed);
          particles.push({
            x: x, y: y,
            vx: Math.cos(a) * s, vy: Math.sin(a) * s,
            life: rand(0.35, 0.9), maxLife: 0.9, color: color
          });
        }
      }

      // ---------- Scoring ----------
      function addScore(n) {
        score += n;
        if (score >= nextExtraLife) {
          nextExtraLife += 10000;
          lives++;
          sfx.extraLife();
          updateLives();
        }
        if (score > best) best = score;
        updateHud();
      }

      // ---------- Saucer ----------
      function spawnSaucer() {
        var fromLeft = Math.random() < 0.5;
        var small = score > 4000 && Math.random() < 0.6; // small saucer: faster, accurate, worth more
        saucer = {
          x: fromLeft ? -30 : W + 30,
          y: rand(H * 0.15, H * 0.85),
          vx: (fromLeft ? 1 : -1) * (small ? 130 : 95),
          vy: 0, r: small ? 11 : 17, small: small,
          wobble: rand(0, Math.PI * 2), fireTimer: rand(0.8, 1.4)
        };
        sfx.saucer();
      }
      function saucerShoot() {
        if (!saucer || !ship || ship.dead) return;
        var ang;
        if (saucer.small) {
          ang = Math.atan2(ship.y - saucer.y, ship.x - saucer.x) + rand(-0.08, 0.08);
        } else {
          ang = rand(0, Math.PI * 2);
        }
        saucerBullets.push({
          x: saucer.x, y: saucer.y,
          vx: Math.cos(ang) * 320, vy: Math.sin(ang) * 320,
          life: 1.4, r: 3
        });
        beep(520, 0.1, "square", 0.04, 180);
      }

      // ---------- Flow ----------
      function startGame() {
        ensureAudio();
        score = 0; lives = 3; wave = 1; nextExtraLife = 10000;
        bullets = []; saucerBullets = []; particles = []; saucer = null;
        ship = makeShip();
        spawnWave();
        state = STATE.PLAYING;
        overlay.classList.add("hidden");
        updateHud(); updateLives();
      }
      function gameOver() {
        state = STATE.OVER;
        var isBest = score >= best && score > 0;
        overlayCard.innerHTML =
          "<h2>GAME OVER</h2>" +
          "<p class='final-score'>" + score.toLocaleString() + "</p>" +
          (isBest ? "<p class='new-best'>★ New best ★</p>" : "<p class='sub'>Best: " + best.toLocaleString() + "</p>") +
          "<p class='sub'>You cleared " + (wave - 1) + (wave - 1 === 1 ? " wave" : " waves") + " and reached wave " + wave + ".</p>" +
          "<button class='big-btn' id='again-btn' type='button'>PLAY AGAIN</button>" +
          "<p class='sub' style='margin-top:14px'>or press Enter</p>";
        overlay.classList.remove("hidden");
        document.getElementById("again-btn").addEventListener("click", startGame);
      }
      function showMenu() {
        state = STATE.MENU;
        overlayCard.innerHTML =
          "<h1>ASTEROIDS</h1>" +
          "<p>Blast the rocks. Don't get hit.<br>Every rock you break makes two more problems.</p>" +
          "<div class='points-table'>" +
          "<div><span>●</span> Large asteroid — 20 &nbsp;·&nbsp; <span>●</span> Medium — 50 &nbsp;·&nbsp; <span>●</span> Small — 100</div>" +
          "<div><span>◆</span> Big saucer — 200 &nbsp;·&nbsp; <span>◆</span> Small saucer — 1,000 &nbsp;·&nbsp; Extra ship every 10,000</div>" +
          "</div>" +
          "<button class='big-btn' id='start-btn' type='button'>START GAME</button>" +
          "<div class='controls-list'>" +
          "<b>◀ ▶ or A / D</b><span>Rotate</span>" +
          "<b>▲ or W</b><span>Thrust</span>" +
          "<b>SPACE</b><span>Fire</span>" +
          "<b>P</b><span>Pause</span>" +
          "</div>";
        overlay.classList.remove("hidden");
        document.getElementById("start-btn").addEventListener("click", startGame);
      }
      function showPaused() {
        overlayCard.innerHTML =
          "<h1 style='font-size:clamp(28px,6vw,44px)'>PAUSED</h1>" +
          "<button class='big-btn' id='resume-btn' type='button'>RESUME</button>" +
          "<p class='sub' style='margin-top:14px'>or press P</p>";
        overlay.classList.remove("hidden");
        document.getElementById("resume-btn").addEventListener("click", togglePause);
      }
      function togglePause() {
        if (state === STATE.PLAYING) {
          state = STATE.PAUSED;
          showPaused();
        } else if (state === STATE.PAUSED) {
          state = STATE.PLAYING;
          overlay.classList.add("hidden");
        }
      }

      // ---------- HUD ----------
      var shipIcon = "<svg viewBox='-12 -12 24 24' fill='none' stroke='#6ee7e0' stroke-width='1.8'><path d='M10 0 L-7 7 L-4 0 L-7 -7 Z'/></svg>";
      function updateLives() {
        var html = "";
        for (var i = 0; i < Math.min(lives, 8); i++) html += shipIcon;
        livesEl.innerHTML = html;
      }
      function updateHud() {
        scoreEl.textContent = score.toLocaleString();
        highEl.textContent = "BEST " + best.toLocaleString();
        waveEl.textContent = wave;
      }

      // ---------- Update ----------
      function update(dt) {
        time += dt;
        // particles always drift, even in menu
        for (var pi = particles.length - 1; pi >= 0; pi--) {
          var p = particles[pi];
          p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt;
          if (p.life <= 0) particles.splice(pi, 1);
        }
        if (shake > 0) shake = Math.max(0, shake - dt * 26);

        if (state !== STATE.PLAYING) {
          // menu backdrop: rocks drift slowly
          for (var ri = 0; ri < rocks.length; ri++) {
            var r0 = rocks[ri];
            r0.x += r0.vx * dt * 0.4; r0.y += r0.vy * dt * 0.4; r0.rot += r0.vrot * dt;
            wrap(r0);
          }
          return;
        }

        // wave break
        if (rocks.length === 0 && !saucer) {
          waveBreakTimer -= dt;
          if (waveBreakTimer <= 0) {
            wave++;
            ship = ship && !ship.dead ? ship : makeShip();
            if (ship.dead) { ship = makeShip(); }
            spawnWave();
            sfx.wave();
            updateHud();
          }
        }

        // ----- ship -----
        if (ship && !ship.dead) {
          if (keys.left) ship.angle -= 4.4 * dt;
          if (keys.right) ship.angle += 4.4 * dt;
          ship.thrusting = keys.thrust;
          if (keys.thrust) {
            ship.vx += Math.cos(ship.angle) * 340 * dt;
            ship.vy += Math.sin(ship.angle) * 340 * dt;
            if (Math.random() < 0.6) {
              particles.push({
                x: ship.x - Math.cos(ship.angle) * 12,
                y: ship.y - Math.sin(ship.angle) * 12,
                vx: -Math.cos(ship.angle) * rand(40, 90) + rand(-16, 16),
                vy: -Math.sin(ship.angle) * rand(40, 90) + rand(-16, 16),
                life: rand(0.15, 0.35), maxLife: 0.35, color: "#ffd23f"
              });
            }
          }
          // drag
          ship.vx *= Math.pow(0.35, dt);
          ship.vy *= Math.pow(0.35, dt);
          ship.x += ship.vx * dt;
          ship.y += ship.vy * dt;
          wrap(ship);
          if (ship.invuln > 0) ship.invuln -= dt;
          ship.fireCooldown -= dt;
          if (keys.fire && ship.fireCooldown <= 0 && bullets.length < 6) {
            ship.fireCooldown = 0.16;
            bullets.push({
              x: ship.x + Math.cos(ship.angle) * 13,
              y: ship.y + Math.sin(ship.angle) * 13,
              vx: ship.vx + Math.cos(ship.angle) * 520,
              vy: ship.vy + Math.sin(ship.angle) * 520,
              life: 0.85, r: 3
            });
            sfx.shoot();
          }
        }

        // ----- bullets -----
        var i, b;
        for (i = bullets.length - 1; i >= 0; i--) {
          b = bullets[i];
          b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
          wrap(b);
          if (b.life <= 0) bullets.splice(i, 1);
        }
        for (i = saucerBullets.length - 1; i >= 0; i--) {
          b = saucerBullets[i];
          b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
          wrap(b);
          if (b.life <= 0) saucerBullets.splice(i, 1);
        }

        // ----- rocks -----
        for (i = 0; i < rocks.length; i++) {
          var r = rocks[i];
          r.x += r.vx * dt; r.y += r.vy * dt; r.rot += r.vrot * dt;
          wrap(r);
        }

        // ----- saucer -----
        if (!saucer) {
          saucerTimer -= dt;
          if (saucerTimer <= 0 && rocks.length > 0) spawnSaucer();
        } else {
          saucer.wobble += dt * 2.2;
          saucer.x += saucer.vx * dt;
          saucer.y += Math.sin(saucer.wobble) * 34 * dt;
          saucer.fireTimer -= dt;
          if (saucer.fireTimer <= 0) { saucer.fireTimer = saucer.small ? rand(0.7, 1.1) : rand(1.0, 1.6); saucerShoot(); }
          if (saucer.x < -50 || saucer.x > W + 50) { saucer = null; saucerTimer = rand(20, 34); }
        }

        // ----- collisions: bullets vs rocks / saucer -----
        for (i = bullets.length - 1; i >= 0; i--) {
          b = bullets[i];
          var consumed = false;
          if (saucer && dist2(b, saucer) < (saucer.r + b.r) * (saucer.r + b.r)) {
            addScore(saucer.small ? 1000 : 200);
            explode(saucer.x, saucer.y, 26, "#6ee7e0", 190);
            sfx.rock(true);
            saucer = null; saucerTimer = rand(20, 34);
            bullets.splice(i, 1);
            consumed = true;
          }
          if (consumed) continue;
          for (var j = rocks.length - 1; j >= 0; j--) {
            var rk = rocks[j];
            if (dist2(b, rk) < (rk.r * 0.92 + b.r) * (rk.r * 0.92 + b.r)) {
              bullets.splice(i, 1);
              rocks.splice(j, 1);
              addScore(rk.size === 3 ? 20 : rk.size === 2 ? 50 : 100);
              explode(rk.x, rk.y, rk.size === 3 ? 18 : 10, "#e8f1f2", 150);
              sfx.rock(rk.size === 3);
              if (rk.size > 1) {
                rocks.push(makeRock(rk.x + rand(-6, 6), rk.y + rand(-6, 6), rk.size - 1));
                rocks.push(makeRock(rk.x + rand(-6, 6), rk.y + rand(-6, 6), rk.size - 1));
              }
              if (rocks.length === 0) waveBreakTimer = 1.6;
              break;
            }
          }
        }

        // ----- collisions: saucer bullets vs rocks (classic: saucer can break rocks) -----
        for (i = saucerBullets.length - 1; i >= 0; i--) {
          b = saucerBullets[i];
          for (var k = rocks.length - 1; k >= 0; k--) {
            var rk2 = rocks[k];
            if (dist2(b, rk2) < (rk2.r * 0.92 + b.r) * (rk2.r * 0.92 + b.r)) {
              saucerBullets.splice(i, 1);
              rocks.splice(k, 1);
              explode(rk2.x, rk2.y, 10, "#e8f1f2", 140);
              if (rk2.size > 1) {
                rocks.push(makeRock(rk2.x, rk2.y, rk2.size - 1));
                rocks.push(makeRock(rk2.x, rk2.y, rk2.size - 1));
              }
              if (rocks.length === 0) waveBreakTimer = 1.6;
              break;
            }
          }
        }

        // ----- collisions: ship vs rocks / saucer bullets / saucer -----
        if (ship && !ship.dead && ship.invuln <= 0) {
          var hit = false;
          for (var m = 0; m < rocks.length; m++) {
            if (dist2(ship, rocks[m]) < (rocks[m].r * 0.85 + ship.r * 0.8) * (rocks[m].r * 0.85 + ship.r * 0.8)) { hit = true; break; }
          }
          if (!hit && saucer && dist2(ship, saucer) < (saucer.r + ship.r) * (saucer.r + ship.r)) hit = true;
          if (!hit) {
            for (var s2 = 0; s2 < saucerBullets.length; s2++) {
              if (dist2(ship, saucerBullets[s2]) < (ship.r + 4) * (ship.r + 4)) { hit = true; saucerBullets.splice(s2, 1); break; }
            }
          }
          if (hit) killShip();
        }
      }

      function killShip() {
        explode(ship.x, ship.y, 34, "#ffd23f", 220);
        explode(ship.x, ship.y, 16, "#6ee7e0", 150);
        sfx.ship();
        shake = 9;
        ship.dead = true;
        lives--;
        updateLives();
        setTimeout(tryRespawn, 1100);
      }
      function tryRespawn() {
        if (state !== STATE.PLAYING) return;
        if (lives <= 0) { gameOver(); return; }
        // respawn only when the center is reasonably clear
        var clear = true;
        for (var i = 0; i < rocks.length; i++) {
          if (dist2(rocks[i], { x: W / 2, y: H / 2 }) < 130 * 130) { clear = false; break; }
        }
        if (clear) {
          ship = makeShip();
        } else {
          setTimeout(tryRespawn, 500);
        }
      }

      // ---------- Draw ----------
      function drawShipShape(scale) {
        ctx.beginPath();
        ctx.moveTo(13 * scale, 0);
        ctx.lineTo(-9 * scale, 8 * scale);
        ctx.lineTo(-5 * scale, 0);
        ctx.lineTo(-9 * scale, -8 * scale);
        ctx.closePath();
      }
      function draw() {
        ctx.fillStyle = "#04070a";
        ctx.fillRect(0, 0, W, H);

        ctx.save();
        if (shake > 0) ctx.translate(rand(-shake, shake) * 0.5, rand(-shake, shake) * 0.5);

        // stars
        for (var i = 0; i < stars.length; i++) {
          var st = stars[i];
          var tw = 0.45 + 0.55 * Math.abs(Math.sin(time * 0.7 + st.p));
          ctx.fillStyle = "rgba(232,241,242," + (0.5 * tw).toFixed(3) + ")";
          ctx.fillRect(st.x, st.y, st.r, st.r);
        }

        // rocks
        ctx.strokeStyle = "#cfd8da";
        ctx.lineWidth = 1.6;
        for (var ri = 0; ri < rocks.length; ri++) {
          var r = rocks[ri];
          ctx.save();
          ctx.translate(r.x, r.y);
          ctx.rotate(r.rot);
          ctx.beginPath();
          for (var vi = 0; vi < r.verts.length; vi++) {
            var v = r.verts[vi];
            var px = Math.cos(v.a) * v.d, py = Math.sin(v.a) * v.d;
            if (vi === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
          }
          ctx.closePath();
          ctx.stroke();
          ctx.restore();
        }

        // saucer
        if (saucer) {
          ctx.save();
          ctx.translate(saucer.x, saucer.y);
          var s = saucer.small ? 0.65 : 1;
          ctx.scale(s, s);
          ctx.strokeStyle = "#6ee7e0";
          ctx.lineWidth = 1.8;
          ctx.beginPath(); // dome
          ctx.arc(0, -4, 7, Math.PI, 0);
          ctx.stroke();
          ctx.beginPath(); // body
          ctx.moveTo(-16, 2); ctx.lineTo(-8, -3); ctx.lineTo(8, -3); ctx.lineTo(16, 2); ctx.lineTo(8, 7); ctx.lineTo(-8, 7);
          ctx.closePath();
          ctx.stroke();
          ctx.restore();
        }

        // bullets
        ctx.fillStyle = "#ffffff";
        for (var bi = 0; bi < bullets.length; bi++) {
          ctx.beginPath();
          ctx.arc(bullets[bi].x, bullets[bi].y, 2.2, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.fillStyle = "#ff5d5d";
        for (var si = 0; si < saucerBullets.length; si++) {
          ctx.beginPath();
          ctx.arc(saucerBullets[si].x, saucerBullets[si].y, 2.4, 0, Math.PI * 2);
          ctx.fill();
        }

        // ship
        if (ship && !ship.dead && state !== STATE.MENU) {
          var blink = ship.invuln > 0 && Math.floor(time * 14) % 2 === 0;
          if (!blink) {
            ctx.save();
            ctx.translate(ship.x, ship.y);
            ctx.rotate(ship.angle);
            ctx.strokeStyle = "#6ee7e0";
            ctx.lineWidth = 1.8;
            ctx.shadowColor = "rgba(110,231,224,0.7)";
            ctx.shadowBlur = 8;
            drawShipShape(1);
            ctx.stroke();
            ctx.shadowBlur = 0;
            if (ship.thrusting && state === STATE.PLAYING) {
              var flick = rand(8, 16);
              ctx.strokeStyle = "#ffd23f";
              ctx.beginPath();
              ctx.moveTo(-6, 4);
              ctx.lineTo(-6 - flick, 0);
              ctx.lineTo(-6, -4);
              ctx.stroke();
            }
            ctx.restore();
          }
        }

        // particles
        for (var pi = 0; pi < particles.length; pi++) {
          var p = particles[pi];
          var alpha = Math.max(0, p.life / p.maxLife);
          ctx.globalAlpha = alpha;
          ctx.fillStyle = p.color;
          ctx.fillRect(p.x - 1.2, p.y - 1.2, 2.4, 2.4);
        }
        ctx.globalAlpha = 1;
        ctx.restore();
      }

      // ---------- Loop ----------
      var lastTs = 0;
      function loop(ts) {
        requestAnimationFrame(loop);
        var dt = Math.min(0.033, (ts - lastTs) / 1000 || 0.016);
        lastTs = ts;
        update(dt);
        draw();
      }

      // ---------- Input: keyboard ----------
      var KEYMAP = {
        ArrowLeft: "left", KeyA: "left",
        ArrowRight: "right", KeyD: "right",
        ArrowUp: "thrust", KeyW: "thrust",
        Space: "fire"
      };
      document.addEventListener("keydown", function (e) {
        ensureAudio();
        if (e.code === "KeyP" || e.code === "Escape") {
          if (state === STATE.PLAYING || state === STATE.PAUSED) { togglePause(); e.preventDefault(); }
          return;
        }
        if (e.code === "Enter") {
          if (state === STATE.MENU || state === STATE.OVER) startGame();
          return;
        }
        var k = KEYMAP[e.code];
        if (k) { keys[k] = true; e.preventDefault(); }
      });
      document.addEventListener("keyup", function (e) {
        var k = KEYMAP[e.code];
        if (k) { keys[k] = false; e.preventDefault(); }
      });
      window.addEventListener("blur", function () {
        keys.left = keys.right = keys.thrust = keys.fire = false;
        if (state === STATE.PLAYING) togglePause();
      });

      // ---------- Input: touch ----------
      function bindHold(id, key) {
        var el = document.getElementById(id);
        function on(e) { e.preventDefault(); ensureAudio(); keys[key] = true; el.classList.add("held"); }
        function off(e) { e.preventDefault(); keys[key] = false; el.classList.remove("held"); }
        el.addEventListener("pointerdown", on);
        el.addEventListener("pointerup", off);
        el.addEventListener("pointerleave", off);
        el.addEventListener("pointercancel", off);
        el.addEventListener("contextmenu", function (e) { e.preventDefault(); });
      }
      bindHold("btn-left", "left");
      bindHold("btn-right", "right");
      bindHold("btn-thrust", "thrust");
      bindHold("btn-fire", "fire");
      if ("ontouchstart" in window || navigator.maxTouchPoints > 0) {
        document.body.classList.add("touch");
      }
      // tapping the canvas on touch devices also reveals controls are below; start audio
      canvas.addEventListener("pointerdown", function () { ensureAudio(); });

      // ---------- HUD buttons ----------
      document.getElementById("pause-btn").addEventListener("click", function () {
        ensureAudio();
        if (state === STATE.PLAYING || state === STATE.PAUSED) togglePause();
      });
      document.getElementById("sound-btn").addEventListener("click", function () {
        soundOn = !soundOn;
        this.textContent = soundOn ? "♪ On" : "♪ Off";
        if (soundOn) ensureAudio();
      });

      // ---------- Boot ----------
      window.addEventListener("resize", resize);
      resize();
      // ambient rocks behind the menu
      for (var mi = 0; mi < 5; mi++) rocks.push(makeRock(rand(0, W), rand(0, H), 3));
      ship = null;
      updateHud(); updateLives();
      showMenu();
      requestAnimationFrame(loop);
    </script>
