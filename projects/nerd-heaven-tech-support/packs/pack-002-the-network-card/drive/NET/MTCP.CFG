# mTCP configuration for the workshop machine.
# The walkthrough beside the console explains every line.
#
# The packet driver software interrupt. The driver will be
# loaded at 0x60, and this line tells the stack where to
# find it. The two must agree, or nothing else matters.
packetint 0x60

# This machine's name on the network.
hostname workshop

# Larger packets generally perform better on Ethernet.
mtu 1500

# Address settings. Run DHCP.EXE and the network's DHCP
# server fills these in and writes them back here. To set
# the machine up statically instead, uncomment the block
# below, put your network's values in, and do not run DHCP.
#
# IPADDR 192.168.1.60
# NETMASK 255.255.255.0
# GATEWAY 192.168.1.1
# NAMESERVER 192.168.1.1
